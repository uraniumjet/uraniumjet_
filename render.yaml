# Render Blueprint for Uranium Jet Digital Solution. Create it with: New > Blueprint > pick this repo.
services:
  - type: web
    name: uranium-jet-digital-solution
    runtime: python
    plan: starter            # always on; a persistent disk needs a paid plan
    region: frankfurt        # closest Render region to Nigeria
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    # The disk is only mounted at run time, so the database is migrated here, not in the build.
    startCommand: python manage.py migrate --no-input && gunicorn config.wsgi:application --workers 2 --threads 2 --timeout 30 --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5            # change to a Python version Render lists as supported
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: SITE_URL
        sync: false              # for example https://www.yourdomain.com
      - key: DJANGO_ALLOWED_HOSTS
        sync: false              # for example www.yourdomain.com,yourdomain.com
      - key: ADMIN_URL
        sync: false              # a path only you know, for example manage-7x2k/
      - key: MAIL_BACKEND
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false              # for example Uranium Jet Digital Solution <contact@yourdomain.com>
      - key: MAIL_TO
        value: uraniumjetdigitalsolution@gmail.com
