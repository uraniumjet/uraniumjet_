{% extends "base.html" %}
{% import "_macros.html" as m with context %}
{% block title %}{{ title }} | {{ site.name }}{% endblock %}
{% block canonical %}{% endblock %}
{% block content %}
<section class="page-head">
  <div class="wrap">
    <h1>{{ title }}</h1>
    <p class="lead">{{ message }}</p>
    <div class="actions">
      <a class="btn btn--primary" href="{{ url_for('home') }}">Go to the home page</a>
      {{ m.wa_button() }}
    </div>
  </div>
</section>
{% endblock %}
