{% extends "base.html" %}
{% block title %}Page not found | {{ site.name }}{% endblock %}
{% block content %}
<section class="page-head">
  <div class="wrap narrow">
    <h1>We could not find that page.</h1>
    <p class="lead">The address may be mistyped, or the page may have moved. Start from the home page, or contact us.</p>
    <div class="actions">
      <a class="btn btn--primary" href="{% url 'home' %}">Go to the home page</a>
      <a class="btn btn--ghost" href="{% url 'contact' %}">Contact us</a>
    </div>
  </div>
</section>
{% endblock %}
